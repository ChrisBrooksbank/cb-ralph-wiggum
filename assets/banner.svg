<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="cb-ralph-wiggum: autonomous AI coding loops for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b3a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff">
    <path d="M0 68H1200M0 136H1200M0 204H1200M0 272H1200"/>
    <path d="M120 0V340M240 0V340M360 0V340M480 0V340M600 0V340M720 0V340M840 0V340M960 0V340M1080 0V340"/>
  </g>

  <!-- the loop -->
  <g transform="translate(965 170)">
    <circle r="112" fill="none" stroke="url(#ring)" stroke-width="10" stroke-dasharray="150 26" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="78" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text y="-14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#94a3b8">while :; do</text>
    <text y="14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#f8fafc">claude -p</text>
    <text y="40" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#94a3b8">done</text>
    <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
      <text x="0" y="-130" text-anchor="middle" fill="#fde68a">plan</text>
      <text x="138" y="5" text-anchor="start" fill="#f9a8d4">build</text>
      <text x="0" y="145" text-anchor="middle" fill="#c4b5fd">test</text>
      <text x="-138" y="5" text-anchor="end" fill="#86efac">commit</text>
    </g>
  </g>

  <!-- copy -->
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="64" y="92" font-size="18" font-weight="600" letter-spacing="3" fill="#a78bfa">CLAUDE CODE SLASH COMMAND</text>
    <text x="62" y="160" font-size="62" font-weight="800" fill="url(#title)">Ralph Wiggum</text>
    <text x="64" y="208" font-size="26" fill="#e2e8f0">Autonomous AI coding loops. Fresh context every iteration.</text>
    <text x="64" y="244" font-size="20" fill="#94a3b8">Specs in. Tested, committed code out. Progress lives in git, not in the model.</text>
    <text x="64" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#86efac">❯ /cb-ralph-wiggum</text>
  </g>
</svg>
